name: Verify Racketeers changes

on:
  pull_request:
  push:
    branches:
      - 'codex/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Manila
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run test:render
      - run: git diff --check
